# Builds every tool on a Windows machine at GitHub and attaches the .exe files
# to a release. Runs when a version tag (v1.2.3) is pushed, or by hand from the
# Actions tab (then the files only end up as a downloadable build artifact).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          $tools = @{
            'document-watchdog' = 'document-watchdog/DocumentWatchdog/DocumentWatchdog.csproj'
            'program-watchdog'  = 'program-watchdog/ProgramWatchdog/ProgramWatchdog.csproj'
            'running-backup'    = 'running-backup/RunningBackup/RunningBackup.csproj'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          # x64 keeps the plain name; Windows on ARM gets its own native build (-arm64).
          $rids = @{ 'win-x64' = ''; 'win-arm64' = '-arm64' }
          foreach ($name in $tools.Keys) {
            foreach ($rid in $rids.Keys) {
              dotnet publish $tools[$name] -c Release -r $rid --self-contained false -p:PublishSingleFile=true -o "build/$name-$rid"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              $exe = Get-ChildItem "build/$name-$rid" -Filter *.exe | Select-Object -First 1
              Copy-Item $exe.FullName "dist/$name$($rids[$rid]).exe"
            }
          }

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: watchdog-tools
          path: dist/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes-file RELEASE_NOTES.md
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/*) --clobber
